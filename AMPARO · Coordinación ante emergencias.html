<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>AMPARO · Coordinación ante emergencias</title>
<style>
:root{--bg:#F3F4F6;--card:#fff;--ink:#374151;--ink2:#6B7280;--line:#D1D5DB;--red:#DC2626;--yel:#FACC15;--org:#F97316;--grn:#15803D;--dark:#1f2937;--sea:#e8eef5;--land:#eef2ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#111827;--card:#1f2937;--ink:#e5e7eb;--ink2:#9ca3af;--line:#374151;--sea:#1b2a3a;--land:#1c2a22}}
:root[data-theme=dark]{--bg:#111827;--card:#1f2937;--ink:#e5e7eb;--ink2:#9ca3af;--line:#374151;--sea:#1b2a3a;--land:#1c2a22}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,Segoe UI,Arial,sans-serif;font-feature-settings:"tnum" 1}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;border-radius:8px;padding:10px 14px;font-weight:650;background:var(--dark);color:#fff;min-height:42px}button.sec{background:var(--card);border:1.5px solid var(--line);color:var(--ink)}button.go{background:var(--grn)}button:disabled{opacity:.4;cursor:not-allowed}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:8px 20px}
body:before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:21}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.08em;font-size:18px}.logo img{height:44px;mix-blend-mode:multiply;border-radius:6px}.logo small{display:block;font-weight:500;letter-spacing:0;font-size:11px;color:var(--ink2)}
.pill{font-size:11px;font-weight:700;padding:4px 9px;border-radius:99px;border:1px solid var(--line);color:var(--ink2);white-space:nowrap}.pill i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--grn);margin-right:5px}
.sp{margin-left:auto;display:flex;gap:8px;align-items:center}select{border:1.5px solid var(--line);background:var(--card);border-radius:8px;padding:9px;min-height:42px}
nav{display:flex;gap:4px;padding:8px 20px;background:var(--card);border-bottom:1px solid var(--line);overflow-x:auto}nav button{background:transparent;color:var(--ink2);white-space:nowrap}nav button.on{background:var(--dark);color:#fff}
main{max-width:1320px;margin:auto;padding:20px}h1{margin:0;font-size:24px}h2{font-size:15px;margin:0 0 10px}.muted{color:var(--ink2)}.src{font-size:12px;color:var(--ink2)}
.banner{display:flex;gap:10px;align-items:center;background:var(--dark);color:#fff;border-radius:10px;padding:10px 14px;margin:14px 0;font-size:13px}.banner b{color:var(--yel)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;border-left:5px solid var(--c)}.kpi span{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2)}.kpi b{display:block;font-size:30px;line-height:1.1}
.g2{display:grid;grid-template-columns:1.6fr 1fr;gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}.stack{display:grid;gap:14px;align-content:start}
.map{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--sea)}svg{display:block;width:100%;height:auto}.node{cursor:pointer}.node:hover .c{stroke-width:5}.pulse{animation:p 1.8s infinite;transform-box:fill-box;transform-origin:center}@keyframes p{0%{opacity:.7;transform:scale(.8)}100%{opacity:0;transform:scale(1.7)}}
.layers{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0 0;font-size:12px}.layers label{display:flex;gap:5px;align-items:center}
.tag{display:inline-flex;gap:4px;align-items:center;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:5px;border:1px solid currentColor;background:color-mix(in srgb,currentColor 10%,var(--card))}
.t-crit{color:var(--red)}.t-high{color:var(--org)}.t-mid{color:#a16207}.t-low{color:var(--grn)}.t-nd{color:var(--ink2)}
.alert{border-left:5px solid var(--red);background:color-mix(in srgb,var(--red) 8%,var(--card));border-radius:6px;padding:10px 12px;margin-bottom:9px}.alert.w{border-color:var(--org);background:color-mix(in srgb,var(--org) 8%,var(--card))}
table{width:100%;border-collapse:collapse}th{font-size:11px;text-align:left;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2)}th,td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}tbody tr{cursor:pointer}tbody tr:hover{background:color-mix(in srgb,var(--ink) 5%,transparent)}.wrap{overflow-x:auto}
.bar{height:8px;border-radius:5px;background:var(--line);overflow:hidden;margin:4px 0}.bar i{display:block;height:100%}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.f{display:flex;flex-direction:column;gap:4px}.f.full{grid-column:1/-1}label.l{font-size:12px;font-weight:700}input,textarea{border:1.5px solid var(--line);background:var(--card);border-radius:8px;padding:9px;min-height:42px}input:focus,select:focus,textarea:focus{outline:2px solid var(--grn)}
.rank{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}.rn{font-size:26px;font-weight:800;min-width:34px}.sc{font-size:22px;font-weight:800}
.seg{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:6px 0;gap:2px}.seg i{display:block}
.res{display:grid;grid-template-columns:1fr 1fr;gap:12px}.st{font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--dark);color:#fff;padding:12px 18px;border-radius:10px;z-index:50;box-shadow:0 8px 24px #0004}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:14px}.tl div{margin-bottom:10px;position:relative}.tl div:before{content:"";position:absolute;left:-20px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--grn)}
#login{position:fixed;inset:0;z-index:60;background:#111827f2;display:grid;place-items:center;padding:20px}
@media(max-width:900px){.g2{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}.form,.res{grid-template-columns:1fr}.pill{display:none}}
</style></head><body>

 ${C.map(k=>{const t=score(k).t,cl=k.acc=='unknown'?'#6B7280':col(t);return `<g class="node" transform="translate(${k.x},${k.y})" onclick="sel='${k.id}';render()" tabindex="0">${k.acc=='unknown'&&L.gap?`<circle r="30" fill="#6B7280" class="pulse"/><circle r="34" fill="none" stroke="#6B7280" stroke-dasharray="4 4"/>`:''}${k.id==sel?'<circle r="30" fill="none" stroke="var(--ink)" stroke-width="2"/>':''}<circle class="c" r="21" fill="${cl}" stroke="#fff" stroke-width="3"/><text y="5" text-anchor="middle" fill="${t>=35&&t<55&&k.acc!='unknown'?'#1f2937':'#fff'}" font-weight="800" font-size="13">${k.acc=='unknown'?'?':t}</text><rect x="-44" y="26" width="88" height="19" rx="4" fill="var(--card)" stroke="var(--line)"/><text y="39" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">${k.n}</text></g>`}).join('')}
 </svg></div><div class="layers"><label><input type="checkbox" ${L.rut?'checked':''} onchange="L.rut=this.checked;render()">Rutas</label><label><input type="checkbox" ${L.rio?'checked':''} onchange="L.rio=this.checked;render()">Río</label><label><input type="checkbox" ${L.gap?'checked':''} onchange="L.gap=this.checked;render()">Vacíos de información</label><span class="src" style="margin-left:auto">Número = índice de prioridad (0–100) · gris con ? = sin datos</span></div>`}
function detail(){const c=C.find(x=>x.id==sel),s=score(c),l=c.acc=='unknown'?['Sin datos','t-nd']:lvl(s.t),a=AC[c.acc];
 const bl=[['Necesidad reportada','var(--red)'],['Población','var(--org)'],['Acceso','var(--yel)'],['Antigüedad del dato','var(--ink2)']];
 return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="font-size:19px;margin:0">${c.n}</h2>${tag(l)}</div><p class="src">Último reporte hace ${c.h} h · ${c.src} · confianza ${c.conf}%</p>
 <p><b>${c.need.length?c.need.join(', '):c.acc=='unknown'?'SIN INFORMACIÓN sobre necesidades':'Sin necesidades reportadas'}</b><br><span class="muted">${c.acc=='unknown'?'La falta de reporte no significa ausencia de necesidades.':'~'+c.p+' familias · acceso '}</span> ${c.acc=='unknown'?'':`<span class="tag ${a[1]}">${a[0]}</span>`}</p>
 <div class="seg">${s.b.map((v,i)=>`<i style="flex:${Math.max(v,.5)};background:${bl[i][1]}"></i>`).join('')}</div>
 <div class="src">${s.b.map((v,i)=>`${bl[i][0]}: <b>+${v}</b>`).join(' · ')}</div>
 <div class="alert w" style="margin-top:12px"><b>¿Por qué?</b> ${c.acc=='unknown'?'Sin contacto hace '+c.h+' h en una zona de crecidas: se prioriza verificar con una misión de enlace antes de enviar carga.':c.acc=='blocked'?'Acceso bloqueado con '+c.p+' familias: requiere ruta alterna (' + c.route + ').':s.t>=55?'Alta necesidad con población numerosa y datos recientes.':'Situación estable; mantener seguimiento.'}</div>
 <p class="src">Ruta sugerida: <b>${c.route}</b> · ETA ${c.eta}</p><button onclick="pg='mis';render()" style="width:100%">Planificar misión a ${c.n}</button></div>`}
function sit(){const R=ranked(),old=C.filter(c=>c.h>12),act=M.filter(m=>m.st=='auth'||m.st=='route').length;
 return `<h1>Panel de situación</h1><p class="muted">Inundación simulada · Subsector Delta Norte · ${NOW}</p>
 <div class="banner"><span style="font-size:20px">⚖</span><div><b>DECISIÓN HUMANA OBLIGATORIA.</b> Las prioridades organizan evidencia; ninguna misión se autoriza sin validación del Coordinador.</div></div>
 <div class="kpis"><div class="kpi" style="--c:var(--grn)"><span>Comunidades</span><b>${C.length}</b></div><div class="kpi" style="--c:var(--red)"><span>Prioridad alta/crítica</span><b>${C.filter(c=>score(c).t>=55).length}</b></div><div class="kpi" style="--c:var(--ink2)"><span>Sin dato reciente (&gt;12 h)</span><b>${old.length}</b></div><div class="kpi" style="--c:var(--org)"><span>Misiones activas</span><b>${act}</b></div></div>
 <div class="g2"><section class="card"><h2>Mapa interactivo · toque una comunidad</h2>${map()}</section><div class="stack">${detail()}<section class="card"><h2>Alertas de información</h2>${old.map(c=>`<div class="alert ${c.h>24?'':'w'}"><b>${c.n}: ${c.h>24?'sin contacto reciente':'actualización pendiente'}</b><br><span class="src">Último reporte hace ${c.h} h</span></div>`).join('')||'<span class="muted">Todo actualizado.</span>'}</section></div></div>
 <section class="card" style="margin-top:14px"><h2>Matriz de comunidades</h2><div class="wrap"><table><thead><tr><th>Comunidad</th><th>Índice</th><th>Necesidades</th><th>Acceso</th><th>Último reporte</th></tr></thead><tbody>${R.map(c=>`<tr onclick="sel='${c.id}';render();scrollTo(0,0)"><td><b>${c.n}</b><div class="src">${c.p} familias</div></td><td>${c.acc=='unknown'?tag(['Sin datos','t-nd']):tag(lvl(score(c).t))} <b>${score(c).t}</b></td><td>${c.need.join(', ')||'<b>Sin información</b>'}</td><td><span class="tag ${AC[c.acc][1]}">${AC[c.acc][0]}</span></td><td>hace ${c.h} h<div class="src">${c.src}</div></td></tr>`).join('')}</tbody></table></div></section>`}
function rep(){if(role=='Brigadista')return `<h1>Registrar reporte</h1><div class="card"><p>El registro está reservado al Operador de radio. Transmita novedades por radio para su verificación.</p></div>`;
 return `<h1>Registrar reporte</h1><p class="muted">Cada reporte conserva fuente, hora y verificación. Al guardar, el índice y el mapa se recalculan.</p><div class="g2" style="grid-template-columns:1.2fr 1fr"><form class="card" onsubmit="save(event)"><div class="form"><div class="f"><label class="l">Comunidad</label><select name="c">${C.map(c=>`<option value="${c.id}">${c.n}</option>`).join('')}</select></div><div class="f"><label class="l">Fuente</label><select name="s"><option>Radio VHF</option><option>Brigada en campo</option><option>Sensor</option><option>Autoridad local</option></select></div><div class="f"><label class="l">Gravedad (1–10)</label><input name="g" type="number" min="0" max="10" value="6" required></div><div class="f"><label class="l">Familias afectadas</label><input name="p" type="number" min="0"></div><div class="f"><label class="l">Acceso vial</label><select name="a"><option value="open">Abierto</option><option value="partial">Parcial</option><option value="blocked">Bloqueado</option><option value="unknown">Sin confirmar</option></select></div><div class="f"><label class="l">Verificación</label><select name="v"><option value="80">Verificado</option><option value="55">Pendiente</option></select></div><div class="f full"><label class="l">Necesidades (separadas por coma)</label><input name="n" placeholder="Agua, alimentos, medicamentos"></div><div class="f full"><label class="l">Observaciones</label><textarea name="o" placeholder="Sin datos personales innecesarios"></textarea></div></div><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px"><button type="reset" class="sec">Limpiar</button><button class="go">Guardar y recalcular</button></div></form><div class="stack"><div class="card"><h2>Privacidad</h2><p class="muted">No registre nombres, teléfonos ni identificadores. Las cifras son estimaciones hasta confirmar.</p></div><div class="card"><h2>Canales previstos</h2><p class="muted">Radio VHF/HF, LoRa para sensores sin señal y enlace satelital en el puesto de mando. Este prototipo usa datos locales simulados.</p></div></div></div>`}
function save(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),c=C.find(x=>x.id==f.c);c.sev=+f.g;if(f.p)c.p=+f.p;c.acc=f.a;c.h=0;c.src=f.s;c.conf=+f.v;c.done=0;c.need=f.n?f.n.split(',').map(x=>x.trim()).filter(Boolean):[];sel=c.id;pg='sit';render();scrollTo(0,0);toast('Reporte guardado · prioridades actualizadas')}
function alloc(){let o={agua:S0.agua-S.agua[1],rac:S0.rac-S.rac[1],bot:S0.bot-S.bot[1],lon:S0.lon-S.lon[1]},av={...Object.fromEntries(Object.keys(S).map(k=>[k,S[k][0]]))},out={};
 for(const c of ranked().filter(c=>c.acc!='unknown'&&c.need.length)){const f=c.p/100,q={agua:c.need.includes('Agua')?Math.round(f*100):0,rac:c.need.includes('Alimentos')?Math.round(f*40):0,bot:c.need.some(n=>/médic|Medic/.test(n))?Math.ceil(f*2):0,lon:c.need.includes('Lonas')?Math.round(f*20):0};
  for(const k in q){q[k]=Math.min(q[k],av[k]);av[k]-=q[k]}out[c.id]=q}return out}
function pri(){const R=ranked(),A=alloc();return `<h1>Priorización explicable</h1><p class="muted">Índice 0–100 = necesidad + población + acceso + antigüedad del dato. Se recalcula con cada reporte, ruta o entrega.</p><div class="banner"><span>⚖</span><div>Recomendaciones, no órdenes. El Coordinador evalúa seguridad y contexto.</div></div><div class="g2" style="grid-template-columns:1.2fr 1fr"><section class="card"><h2>Orden de atención sugerido</h2>${R.map((c,i)=>{const s=score(c),l=c.acc=='unknown'?['Verificar','t-nd']:lvl(s.t);return `<div class="rank" onclick="sel='${c.id}';pg='sit';render();scrollTo(0,0)"><div class="rn" style="color:${col(s.t)}">${i+1}</div><div style="flex:1"><b>${c.n}</b> ${tag(l)}<div class="bar"><i style="width:${s.t}%;background:${col(s.t)}"></i></div><span class="src">${c.acc=='unknown'?'Sin contacto '+c.h+' h → misión de enlace para verificar':c.need.join(', ')||'Sin necesidades'} · acceso ${AC[c.acc][0].toLowerCase()}</span></div><div class="sc">${s.t}</div></div>`}).join('')}</section><section class="card"><h2>Reparto sugerido de recursos</h2><p class="src">Según orden y existencias disponibles</p>${R.filter(c=>A[c.id]).map(c=>{const q=A[c.id];return `<p><b>${c.n}</b><br>${[q.agua&&q.agua+' L agua',q.rac&&q.rac+' raciones',q.bot&&q.bot+' botiquines',q.lon&&q.lon+' lonas'].filter(Boolean).join(' · ')||'—'}</p>`}).join('')}<div class="alert w"><b>Río Seco</b> no recibe carga: primero enlace de verificación.</div></section></div>`}
function rec(){return `<h1>Recursos</h1><p class="muted">Disponible, reservado y comprometido. La reserva se descuenta al autorizar.</p><div class="res"><section class="card"><h2>Suministros</h2>${Object.keys(S).map(k=>`<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between"><b>${SN[k]}</b><span>${S[k][0]} <span class="src">/ ${S0[k]}</span></span></div><div class="bar"><i style="width:${S[k][0]/S0[k]*100}%;background:var(--grn)"></i></div><span class="src">Reservado: ${S[k][1]}</span></div>`).join('')}</section><section class="card"><h2>Transporte y equipos</h2>${[['Camioneta 4x4 V-01','Disponible'],['Camión ligero V-02','Disponible'],['Lancha L-01','Disponible'],['Ambulancia A-01','No disponible'],['Brigada Norte (5)','Disponible'],['Equipo médico (3)','Disponible']].map(x=>`<p style="display:flex;justify-content:space-between;margin:8px 0;border-bottom:1px solid var(--line);padding-bottom:8px"><b>${x[0]}</b><span class="tag ${x[1]=='Disponible'?'t-low':'t-nd'}">${x[1]}</span></p>`).join('')}</section></div>`}
function mis(){const can=role=='Coordinador';const dest=ranked();
 return `<h1>Misiones y seguimiento</h1><p class="muted">Borrador → Pendiente → Autorizada → En ruta → Completada</p><div class="g2" style="grid-template-columns:1fr 1.2fr"><form class="card" onsubmit="newm(event)"><h2>Nueva misión</h2><div class="f"><label class="l">Destino</label><select name="c">${dest.map(c=>`<option value="${c.id}" ${c.id==sel?'selected':''}>${c.n}</option>`).join('')}</select></div><div class="f" style="margin-top:10px"><label class="l">Carga</label><select name="k"><option value="agua">300 L agua</option><option value="rac">80 raciones</option><option value="bot">6 botiquines</option><option value="lon">20 lonas</option><option value="enlace">Enlace de verificación (sin carga)</option></select></div>${role=='Brigadista'?'<p class="lock src">Los brigadistas consultan; la creación se hace en el puesto de mando.</p>':'<button class="go" style="width:100%;margin-top:14px">Solicitar autorización</button>'}</form><section class="card"><h2>Seguimiento</h2>${M.length?`<div class="wrap"><table><tbody>${M.map(m=>{const c=C.find(x=>x.id==m.c),nm={pend:'Pendiente',auth:'Autorizada',route:'En ruta',done:'Completada'}[m.st];let a='';if(m.st=='pend')a=can?`<button class="go" onclick="auth('${m.id}')">Autorizar</button>`:'<span class="src">Espera al Coordinador</span>';if(m.st=='auth')a=`<button onclick="adv('${m.id}','route')">En ruta</button>`;if(m.st=='route')a=`<button class="go" onclick="fin('${m.id}')">Confirmar entrega</button>`;return `<tr style="cursor:default"><td><b>${m.id} · ${c.n}</b><div class="src">${m.r} · ${m.t}</div></td><td><span class="tag ${m.st=='done'?'t-low':m.st=='pend'?'t-mid':'t-nd'}">${nm}</span></td><td>${a}</td></tr>`}).join('')}</tbody></table></div>`:''}</section></div>`}
const LD={agua:['300 L agua',300],rac:['80 raciones',80],bot:['6 botiquines',6],lon:['20 lonas',20],enlace:['Enlace de verificación',0]};
function newm(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));M.unshift({id:'M-'+String(14+M.length).padStart(3,'0'),c:f.c,k:f.k,r:LD[f.k][0],st:'pend',t:NOW});render();toast('Solicitud enviada al Coordinador')}
function auth(id){if(role!='Coordinador')return toast('Solo el Coordinador autoriza');const m=M.find(x=>x.id==id);if(m.k!='enlace'){if(S[m.k][0]<LD[m.k][1])return toast('Existencias insuficientes');S[m.k][0]-=LD[m.k][1];S[m.k][1]+=LD[m.k][1]}m.st='auth';render();toast('Misión autorizada')}
function adv(id,s){M.find(x=>x.id==id).st=s;render()}
function fin(id){const m=M.find(x=>x.id==id),c=C.find(x=>x.id==m.c);m.st='done';if(m.k!='enlace')S[m.k][1]-=LD[m.k][1];c.h=0;if(m.k=='enlace'){c.acc='partial';c.sev=7;c.need=['Agua','Medicamentos'];c.src='Brigada de enlace';c.conf=75;toast('Enlace llegó a '+c.n+': datos actualizados, el índice cambió')}else{c.sev=Math.max(1,c.sev-4);c.done=1;toast('Entrega confirmada · prioridad recalculada')}render()}
function render(){nav();$('#v').innerHTML=({sit,rep,pri,rec,mis})[pg]()}
render();
</script></body></html>
